[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-boundary-auditor"
version = "0.1.0"
description = "Offline static auditing for MCP tool permission boundaries"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
mcp-boundary-audit = "mcp_boundary_auditor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
exclude = ["docs/**"]

